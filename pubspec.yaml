name: rentory
description: "Rentory v2 - Marketplace Sewa Barang Multi-Vendor"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  # Routing
  go_router: ^12.1.3
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # JSON Serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  # Utils
  intl: ^0.18.1
  timezone: ^0.9.2
  meta: ^1.10.0
  # Image Picker
  image_picker: ^1.0.7
  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.11.1
  # Path & File
  path_provider: ^2.1.1
  # Maps (Future)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  # UI Helpers
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  # Icons
  phosphor_flutter: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Code Generation
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/products/
    - assets/images/
    - lib/data/dummy/
