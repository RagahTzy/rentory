name: rentory
description: "Rentory v2 - Marketplace Sewa Barang Multi-Vendor"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  # State Management
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  # Routing
  go_router: ^18.1.4
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # JSON Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  # Utils
  intl: ^0.20.3
  timezone: ^0.11.2
  meta: ^1.10.0
  # Image Picker
  image_picker: ^1.0.7
  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.11.1
  # Path & File
  path_provider: ^2.1.1
  # Maps (Future)
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  # UI Helpers
  cached_network_image: ^4.0.7
  shimmer: ^4.0.0
  # Icons — JANGAN dihapus: font Phosphor-nya dipakai oleh lib/core/theme/app_icons.dart.
  # Library Dart-nya sengaja tidak di-import karena belum kompatibel dengan
  # Flutter 3.47 (IconData sekarang final class).
  phosphor_flutter: ^2.1.0
  cupertino_icons: ^2.0.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Code Generation
  riverpod_generator: ^4.0.10
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true
